# Optional gateway route for Codex (Responses over HTTP). The key comes from $PORTKEY_API_KEY at
# run time; nothing secret lives in this file. Without a gateway, omit this file and export
# OPENAI_API_KEY instead.
model_provider = "portkey"

[model_providers.portkey]
name = "Portkey"
base_url = "https://api.portkey.ai/v1"
wire_api = "responses"
http_headers = { "x-portkey-provider" = "@openai" }
env_http_headers = { "x-portkey-api-key" = "PORTKEY_API_KEY" }
