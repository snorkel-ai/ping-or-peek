  <!-- Shortcut path (orange): agent to scorer.py -->
  <rect
     x="456"
     y="172"
     width="150"
     height="44"
     rx="8"
     fill="#ffffff"
     stroke="#eb6834"
     stroke-width="1.5"
     id="rect22" />
  <text
     x="470"
     y="191"
     font-size="12.5px"
     font-weight="600"
     fill="#0b0b0b"
     id="text23">Read the grader</text>
  <text
     x="470"
     y="207"
     font-size="11.5px"
     fill="#52514e"
     id="text24">and edit the file it names</text>
  <!-- agent reads both CSVs -->
  <line
     x1="532"
     y1="100"
     x2="606"
     y2="100"
     stroke="#52514e"
     stroke-width="1.5"
     marker-end="url(#arrow-ink)"
     id="line24" />
  <!-- Conditions strip -->
  <text
     x="20"
     y="256"
     font-size="12.5px"
     font-weight="600"
     fill="#0b0b0b"
     id="text25">Three conditions, 15 seeds each</text>
  <rect
     x="20"
     y="262"
     width="266"
     height="54"
     rx="8"
     fill="#ffffff"
     stroke="#c3c2b7"
