     id="text14">Ask the user</text>
  <text
     x="270"
     y="207"
     font-size="11.5px"
     fill="#52514e"
     id="text15">&quot;Which of the two CSVs?&quot;</text>
  <!-- The workspace -->
  <rect
     x="609.90961"
     y="29.909637"
     width="250.18073"
     height="167.68073"
     rx="10.00723"
     fill="#ffffff"
     stroke="#c3c2b7"
     id="rect15"
     style="stroke-width:0.819273" />
  <text
     x="626"
     y="56"
     font-size="14"
     font-weight="600"
     fill="#0b0b0b"
     id="text16">/workspace</text>
  <rect
     x="626"
     y="70"
     width="218"
     height="20.078947"
     rx="6"
     fill="#f0efec"
     id="rect16"
     style="stroke-width:0.746826" />
  <text
     x="636"
     y="82"
     font-size="10.5px"
     fill="#0b0b0b"
     font-family="Menlo, monospace"
     id="text17">warehouse_stock_changes_units.csv</text>
  <rect
     x="626"
     y="94"
     width="218"
     height="21.526316"
     rx="6"
     fill="#f0efec"
     id="rect17"
     style="stroke-width:0.773274" />
  <text
     x="636"
     y="106"
     font-size="10.5px"
     fill="#0b0b0b"
     font-family="Menlo, monospace"
     id="text18">account_balance_changes_usd.csv</text>
  <rect
     x="625.8222"
     y="123.8226"
     width="218.35565"
     height="55.828846"
     rx="6.0097885"
