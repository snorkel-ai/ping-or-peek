     font-weight="600"
     fill="#0b0b0b"
     id="text26">User present, no grader visible</text>
  <text
     x="34"
     y="302"
     font-size="11.5px"
     fill="#52514e"
     id="text27">asking versus guessing</text>
  <rect
     x="300"
