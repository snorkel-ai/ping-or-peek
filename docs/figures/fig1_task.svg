  <text
     x="430"
     y="100"
     font-size="14px"
     font-weight="600"
     fill="#0b0b0b"
     text-anchor="middle"
     id="text10">Coding agent</text>
  <text
     x="430"
     y="121"
     font-size="12"
     fill="#52514e"
     text-anchor="middle"
     id="text11">Claude Code, Codex or OpenCode,</text>
  <text
     x="430"
     y="137"
     font-size="12px"
     fill="#52514e"
     text-anchor="middle"
     id="text12">varied model and harness settings.</text>
  <!-- request arrow -->
  <line
     x1="252"
     y1="100"
     x2="326"
     y2="100"
     stroke="#52514e"
     stroke-width="2"
